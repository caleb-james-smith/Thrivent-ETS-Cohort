name: Run Tests On Redux Example App

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignments/week-4/redux-example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: assignments/week-4/redux-example/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
