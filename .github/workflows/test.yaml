name: Run Assignments Tests

on:
  workflow_dispatch:

jobs:

  test-redux-example:
    name: Test Redux Example App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignments/week-4/redux-example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assignments/week-4/redux-example/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-redux-state-practice:
    name: Test Redux State Practice App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assignments/week-4/redux-state-practice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assignments/week-4/redux-state-practice/package-lock.json
        
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
